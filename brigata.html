<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Brigata · Gruppo Orso</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap');

:root{
  --bg:#07120D; --surface:#0B1A12; --card:#0F2318;
  --border:#1C3828; --border2:rgba(28,56,40,0.5);
  --gold:#C8973A; --gold2:#EEC84A; --gold3:#F7DFA0;
  --cream:#F5EFE3; --cream2:#D8CEBC; --dim:#6A7060; --dim2:#3A4238;
  --ok:#5DBFA0; --warn:#E8B84A; --bad:#D45050;
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,34px);
  --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif; --serif:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--sans);color:var(--cream);-webkit-font-smoothing:antialiased;overflow:hidden}

.app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;position:relative}
.views{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bot) + 90px)}
.view.hidden{display:none}
.view::-webkit-scrollbar{display:none}

.hdr{
  padding:calc(var(--safe-top) + 6px) 16px 12px;
  background:linear-gradient(180deg,rgba(7,18,13,0.98),rgba(11,26,18,0.9));
  backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;justify-content:space-between;
}
.hdr-title{font-family:var(--serif);font-size:19px;color:var(--cream)}
.hdr-title em{color:var(--gold2);font-style:italic}
.hdr-sub{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:2px}

.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:16px;cursor:pointer}
.iconbtn:active{background:var(--border)}

.section{padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:12px}
.label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:8px}

/* week nav */
.weeknav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px}
.weeknav-label{font-family:var(--serif);font-size:16px;text-align:center;flex:1}
.weeknav-label small{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px;margin-top:2px}

/* locale block on turni view */
.locale-block{margin-bottom:16px}
.locale-hd{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.locale-name{font-family:var(--serif);font-size:16px;color:var(--gold3)}
.locale-badge{font-family:var(--mono);font-size:9px;color:var(--dim)}

.day-row{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px}
.day-row.short{border-color:var(--bad);border-width:1px}
.day-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.day-name{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--cream2);text-transform:uppercase}
.day-count{font-family:var(--mono);font-size:10px;color:var(--dim)}
.day-count.ok{color:var(--ok)}
.day-count.short{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border2);
  border-radius:20px;padding:5px 10px 5px 6px;font-size:12px}
.chip .pos{font-family:var(--mono);font-size:8px;color:var(--gold2);background:rgba(200,151,58,0.15);
  border-radius:6px;padding:2px 5px;letter-spacing:0.5px}
.chip .rm{color:var(--dim);font-size:11px;cursor:pointer;padding:0 2px}
.chip-add{display:flex;align-items:center;justify-content:center;width:30px;height:26px;border-radius:20px;
  border:1px dashed var(--border2);color:var(--gold);font-size:14px;cursor:pointer}

.btn{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:12px;padding:11px 16px;border:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0B1A12}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--cream2)}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:11px;border-radius:9px}

/* bottom nav */
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(11,26,18,0.97);
  backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:8px 6px calc(var(--safe-bot) + 6px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--dim);cursor:pointer;border-radius:10px}
.tab.active{color:var(--gold2)}
.tab-ic{font-size:18px}
.tab-lb{font-family:var(--mono);font-size:8px;letter-spacing:0.5px;text-transform:uppercase}

/* pizzaioli */
.piz-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:10px}
.piz-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.piz-name{font-family:var(--serif);font-size:16px}
.piz-role{font-family:var(--mono);font-size:9px;color:var(--gold2);letter-spacing:1px;text-transform:uppercase}
.skillrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.skillrow .sk-name{width:80px;font-family:var(--mono);font-size:10px;color:var(--dim2);color:var(--cream2)}
.skillrow input[type=range]{flex:1;accent-color:var(--gold)}
.skillrow .sk-val{width:22px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--gold2)}

/* ferie */
.rq-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px}
.rq-info{flex:1}
.rq-name{font-size:14px;font-weight:600}
.rq-dates{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
.rq-status{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:8px}
.rq-status.approvato{background:rgba(93,191,160,0.15);color:var(--ok)}
.rq-status.conflitto{background:rgba(212,80,80,0.15);color:var(--bad)}
.rq-status.rifiutato{background:rgba(120,120,120,0.15);color:var(--dim)}

.form-row{margin-bottom:10px}
.form-row label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.form-row select,.form-row input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;
  padding:9px 10px;color:var(--cream);font-family:var(--sans);font-size:13px}
.form-row-2{display:flex;gap:10px}
.form-row-2 .form-row{flex:1}

/* locali config */
.locale-cfg{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:12px}
.locale-cfg-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.toggle{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.toggle input{accent-color:var(--gold)}
.fabb-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.fabb-cell{text-align:center}
.fabb-cell label{display:block;font-family:var(--mono);font-size:8px;color:var(--dim);margin-bottom:4px}
.fabb-cell input{width:100%;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:7px;
  padding:6px 2px;color:var(--gold2);font-family:var(--mono);font-size:12px}

/* print view */
.print-week{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:6px;margin-bottom:14px}

/* ============ FOGLIO DI BRIGATA (print sheet) ============ */
.foglio{
  --paper:#F3ECDA; --paper2:#EAE1C8; --ink:#241C12; --ink2:#4A4033;
  --inkfaint:rgba(36,28,18,0.35); --rule:rgba(36,28,18,0.22);
  --brass:#8C6A2E; --brass2:#B08A3E;
  background:var(--paper);
  background-image:
    radial-gradient(ellipse at 15% 8%, rgba(140,106,46,0.06), transparent 45%),
    radial-gradient(ellipse at 88% 92%, rgba(140,106,46,0.05), transparent 45%);
  color:var(--ink);
  border-radius:8px;
  padding:26px 22px 20px;
  font-family:var(--sans);
  box-shadow:inset 0 0 0 1px rgba(36,28,18,0.08);
}
.foglio-top{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.foglio-seal{flex:none;width:64px;height:64px}
.foglio-masthead{flex:1}
.foglio-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:3px;text-transform:uppercase;color:var(--brass)}
.foglio-title{font-family:var(--serif);font-size:23px;color:var(--ink);margin-top:2px;line-height:1.15}
.foglio-title em{font-style:italic;color:var(--brass2)}
.foglio-range{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-top:4px;letter-spacing:0.5px}
.foglio-issued{text-align:right;font-family:var(--mono);font-size:8.5px;color:var(--inkfaint);letter-spacing:0.5px;line-height:1.6;white-space:nowrap}

.foglio-manifest-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:16px}
.foglio-manifest{width:100%;min-width:640px;border-collapse:collapse;margin-top:0}
.foglio-manifest th{
  font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink2);
  text-align:center;padding:8px 4px 10px;border-bottom:1px solid var(--ink);font-weight:500;
}
.foglio-manifest th.locale-col{text-align:left;padding-left:2px}
.foglio-manifest th .th-date{display:block;font-size:8px;color:var(--inkfaint);margin-top:2px;letter-spacing:0}
.foglio-manifest td{padding:10px 5px;border-bottom:1px solid var(--rule);vertical-align:top}
.foglio-manifest tr:last-child td{border-bottom:1px solid var(--ink)}
.foglio-locale-cell{padding-left:2px !important}
.foglio-locale-name{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--ink);white-space:nowrap}
.foglio-coverage{font-family:var(--mono);font-size:9px;color:var(--brass);letter-spacing:1px;margin-top:3px}
.foglio-slot{font-size:11.5px;line-height:1.85;white-space:nowrap}
.foglio-badge{
  display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;
  border:1px solid var(--ink2);font-family:var(--mono);font-size:8px;color:var(--ink2);margin-right:5px;
}
.foglio-badge.forno{background:var(--brass);border-color:var(--brass);color:var(--paper)}
.foglio-empty-cell{color:var(--inkfaint);font-size:11px;font-style:italic}
.foglio-shortfall{color:#8A2E2E}

.foglio-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;padding-top:12px;border-top:1px solid var(--rule)}
.foglio-legend-item{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;color:var(--ink2);letter-spacing:0.5px}

.foglio-notes{margin-top:22px}
.foglio-notes-label{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--inkfaint);margin-bottom:8px}
.foglio-notes-line{border-bottom:1px dotted var(--rule);height:20px}

.foglio-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:10px;
  border-top:1px solid var(--rule);font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--inkfaint);text-transform:uppercase}


/* modal */
.overlay{position:fixed;inset:0;background:rgba(4,10,7,0.75);backdrop-filter:blur(4px);display:none;
  align-items:flex-end;justify-content:center;z-index:50}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:520px;
  padding:18px 16px calc(var(--safe-bot) + 16px);max-height:78vh;overflow-y:auto}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-title{font-family:var(--serif);font-size:17px}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);
  border-radius:11px;padding:10px 12px;cursor:pointer}
.pick-item .pn{font-size:13px}
.pick-item .pp{font-family:var(--mono);font-size:9px;color:var(--dim)}
.pick-item.disabled{opacity:0.35}
.pos-select{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pos-opt{font-family:var(--mono);font-size:10px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);
  color:var(--cream2);cursor:pointer}
.pos-opt.sel{background:var(--gold);color:#0B1A12;border-color:var(--gold)}

.warn-banner{background:rgba(232,184,74,0.1);border:1px solid rgba(232,184,74,0.35);border-radius:11px;padding:10px 12px;
  font-size:12px;color:var(--warn);margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}

.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty-ic{font-size:30px;margin-bottom:10px;opacity:0.5}
.empty-tx{font-size:13px}

@media print{
  @page{ margin:12mm; }
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
  html,body{background:#F3ECDA !important; overflow:visible !important; height:auto !important; width:auto !important}
  .app,.views,.view{position:static !important; overflow:visible !important; max-width:none !important; width:auto !important; height:auto !important; padding:0 !important; margin:0 !important; background:none !important}
  .hdr, .tabbar, .overlay{ display:none !important; }
  .views > .view:not(#view-stampa){ display:none !important; }
  #view-stampa{ display:block !important; }
  .print-week{background:none !important;border:none !important;padding:0 !important;box-shadow:none !important;margin:0 !important}
  .foglio{box-shadow:none !important;border-radius:0 !important;background:#F3ECDA !important;width:100% !important}
  .foglio-manifest{font-size:10.5px}
  .foglio-manifest-scroll{overflow:visible !important}
  #view-stampa .btn{display:none !important}
}
</style>
</head>
<body>

<div class="app">

  <div class="hdr">
    <div class="iconbtn" onclick="shiftWeek(-1)" data-tabhide="ferie,piz,locali,stampa">‹</div>
    <div style="text-align:center;flex:1">
      <div class="hdr-title">Brigata <em>Orso</em></div>
      <div class="hdr-sub" id="hdrSub">Gestione turni</div>
    </div>
    <div class="iconbtn" onclick="shiftWeek(1)" data-tabhide="ferie,piz,locali,stampa">›</div>
  </div>

  <div class="views">

    <!-- TURNI -->
    <div class="view" id="view-turni">
      <div class="weeknav">
        <div class="weeknav-label" id="weekLabel"></div>
      </div>
      <div class="section" style="padding-top:0">
        <button class="btn btn-primary btn-block" onclick="suggestWeek()">✨ Suggerisci settimana</button>
        <div style="height:14px"></div>
        <div id="turniContent"></div>
      </div>
    </div>

    <!-- FERIE -->
    <div class="view hidden" id="view-ferie">
      <div class="section">
        <div class="card">
          <div class="label">Nuova richiesta</div>
          <div class="form-row">
            <label>Pizzaiolo</label>
            <select id="rqPiz"></select>
          </div>
          <div class="form-row-2">
            <div class="form-row">
              <label>Dal</label>
              <input type="date" id="rqFrom">
            </div>
            <div class="form-row">
              <label>Al</label>
              <input type="date" id="rqTo">
            </div>
          </div>
          <div class="form-row">
            <label>Tipo</label>
            <select id="rqTipo">
              <option value="ferie">Ferie</option>
              <option value="permesso">Permesso</option>
              <option value="malattia">Malattia</option>
            </select>
          </div>
          <button class="btn btn-primary btn-block" onclick="addRichiesta()">Aggiungi richiesta</button>
        </div>
        <div class="form-row" style="margin-top:4px">
          <label>Cerca per pizzaiolo</label>
          <input type="text" id="rqSearch" placeholder="Es. Ragno" oninput="renderFerie()">
        </div>
        <div class="label" id="ferieSummary" style="margin-top:10px">Richieste · priorità automatica per ordine di arrivo</div>
        <div id="richiesteList"></div>
      </div>
    </div>

    <!-- PIZZAIOLI -->
    <div class="view hidden" id="view-piz">
      <div class="section">
        <div class="card">
          <div class="label">Nuovo pizzaiolo</div>
          <div class="form-row">
            <label>Nome e cognome</label>
            <input type="text" id="newPizName" placeholder="Es. Giuseppe Verdi">
          </div>
          <button class="btn btn-primary btn-block" onclick="addPizzaiolo()">Aggiungi alla brigata</button>
        </div>
        <div id="pizList"></div>
      </div>
    </div>

    <!-- LOCALI -->
    <div class="view hidden" id="view-locali">
      <div class="section" id="localiList"></div>
    </div>

    <!-- STAMPA -->
    <div class="view hidden" id="view-stampa">
      <div class="section">
        <button class="btn btn-ghost btn-block" onclick="window.print()">🖨️ Stampa / esporta PDF (solo turni)</button>
        <div style="height:12px"></div>
        <div class="print-area" id="printArea"></div>
      </div>
    </div>

  </div>

  <div class="tabbar">
    <div class="tab active" data-tab="turni" onclick="switchTab('turni')"><div class="tab-ic">📅</div><div class="tab-lb">Turni</div></div>
    <div class="tab" data-tab="ferie" onclick="switchTab('ferie')"><div class="tab-ic">🌴</div><div class="tab-lb">Ferie</div></div>
    <div class="tab" data-tab="piz" onclick="switchTab('piz')"><div class="tab-ic">👤</div><div class="tab-lb">Brigata</div></div>
    <div class="tab" data-tab="locali" onclick="switchTab('locali')"><div class="tab-ic">📍</div><div class="tab-lb">Locali</div></div>
    <div class="tab" data-tab="stampa" onclick="switchTab('stampa')"><div class="tab-ic">🖨️</div><div class="tab-lb">Stampa</div></div>
  </div>
</div>

<!-- MODAL: assegna pizzaiolo -->
<div class="overlay" id="pickerOverlay" onclick="if(event.target===this)closePicker()">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-title" id="pickerTitle">Assegna</div>
      <div class="iconbtn" onclick="closePicker()">✕</div>
    </div>
    <div class="pos-select" id="posSelect"></div>
    <div style="height:10px"></div>
    <div class="pick-list" id="pickList"></div>
  </div>
</div>

<script>
/* ============ DATA MODEL (localStorage) ============ */
const GIORNI = ['lun','mar','mer','gio','ven','sab','dom'];
const GIORNI_LABEL = {lun:'Lunedì',mar:'Martedì',mer:'Mercoledì',gio:'Giovedì',ven:'Venerdì',sab:'Sabato',dom:'Domenica'};
const POSIZIONI = ['forno','stesura','condimento','pasta','entrata/uscita'];
const POS_LABEL = {forno:'FORNO',stesura:'STESURA',condimento:'COND.','pasta':'PASTA','entrata/uscita':'E/U'};

function load(key, def){ try{ const v = localStorage.getItem(key); return v? JSON.parse(v): def; }catch(e){ return def; } }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let pizzaioli = load('brigata_pizzaioli', [
  {id:'p1', nome:'Emanuele Ragno', skills:{forno:9,pasta:7,stesura:8,condimento:7}},
  {id:'p2', nome:'Daniele Lo Forte', skills:{forno:8,pasta:8,stesura:7,condimento:8}},
  {id:'p3', nome:'Aldumiri M. Adeeb', skills:{forno:6,pasta:7,stesura:8,condimento:7}},
  {id:'p4', nome:'Marcello Aloisi', skills:{forno:7,pasta:6,stesura:8,condimento:7}},
  {id:'p5', nome:'Riccardo Maggio', skills:{forno:8,pasta:7,stesura:6,condimento:7}},
  {id:'p6', nome:'Marco Sergi', skills:{forno:6,pasta:8,stesura:7,condimento:6}},
  {id:'p7', nome:'Alessandro Urbino', skills:{forno:7,pasta:7,stesura:7,condimento:8}},
  {id:'p8', nome:'Matias Piccolo', skills:{forno:6,pasta:6,stesura:7,condimento:7}},

/* ============ WEEK HELPERS ============ */
let currentWeekStart = getMonday(new Date());
function getMonday(d){ d = new Date(d); const day = d.getDay(); const diff = (day===0? -6 : 1) - day; d.setDate(d.getDate()+diff); d.setHours(0,0,0,0); return d; }
function weekKey(d){ return d.toISOString().slice(0,10); }
function fmtDate(d){ return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}); }
function dateForDay(giornoIdx){ const d = new Date(currentWeekStart); d.setDate(d.getDate()+giornoIdx); return d; }
function mmdd(d){ return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function localeActiveOnDate(locale, date){
  if(!locale.stagionale) return true;
  const md = mmdd(date);
  return md >= locale.attivoDa && md <= locale.attivoA;
}

function pizzaioloAssente(pizId, date){
  const iso = date.toISOString().slice(0,10);
  return richieste.some(r => r.pizId===pizId && r.stato==='approvato' && iso>=r.from && iso<=r.to);
}

  document.querySelectorAll('[data-tabhide]').forEach(el=>{

function getTurniWeek(){

  locali.forEach(l=>{ if(!turni[wk][l.id]) turni[wk][l.id] = {}; GIORNI.forEach(g=>{ if(!turni[wk][l.id][g]) turni[wk][l.id][g]=[]; }); });
  return turni[wk];
}

/* ============ AUTO-SUGGERISCI SETTIMANA ============ */
function suggestWeek(){
  const data = getTurniWeek();
  // reset settimana
  locali.forEach(l=> GIORNI.forEach(g=> data[l.id][g] = []));

  GIORNI.forEach((g,idx)=>{
    const date = dateForDay(idx);
    const localiAttivi = locali.filter(l=>localeActiveOnDate(l,date));
    let pool = pizzaioli.filter(p=>!pizzaioloAssente(p.id, date)).map(p=>({...p}));
    // ordina locali per fabbisogno decrescente cosi i piu esigenti scelgono prima i migliori
    const ordineLocali = [...localiAttivi].sort((a,b)=>(b.fabbisogno[g]||0)-(a.fabbisogno[g]||0));
    const usati = new Set();
    ordineLocali.forEach(locale=>{
      const need = locale.fabbisogno[g] || 0;
      const disponibili = pool.filter(p=>!usati.has(p.id));
      // scegli i migliori per media skill, ma bilancia: prendi ogni tot il piu forte
      const ordinati = disponibili.sort((a,b)=>{
        const avgA = (a.skills.forno+a.skills.pasta+a.skills.stesura+a.skills.condimento)/4;
        const avgB = (b.skills.forno+b.skills.pasta+b.skills.stesura+b.skills.condimento)/4;
        return avgB-avgA;
      });
      const scelti = ordinati.slice(0, need);
      scelti.forEach(p=>usati.add(p.id));
      // assegna posizioni: forno al piu forte in forno, stesura al piu forte in stesura, ecc, resto pasta/entrata-uscita
      const rimasti = [...scelti];
      const assign = [];
      function pick(skill, pos){
        if(!rimasti.length) return;
        rimasti.sort((a,b)=>b.skills[skill]-a.skills[skill]);
        const p = rimasti.shift();
        assign.push({pizId:p.id, pos});
      }
      pick('forno','forno');
      pick('stesura','stesura');
      pick('condimento','condimento');
      rimasti.forEach((p,i)=> assign.push({pizId:p.id, pos: i%2===0? 'pasta':'entrata/uscita'}));
      data[locale.id][g] = assign;
    });
  });
  persistAll();
  renderTurni();
}

// priorita automatica: chi ha chiesto prima (ts piu basso) ha precedenza.
// per ogni giorno coperto da una richiesta, se troppe assenze fanno scendere
// la disponibilita sotto il fabbisogno minimo di un locale attivo, le richieste
// arrivate dopo su quel giorno vengono segnate 'conflitto' invece di 'approvato'.
function recomputeRichiesteStatus(){
  richieste.forEach(r=>{ if(!r.tipo) r.tipo = 'ferie'; });
  const ordinate = [...richieste].sort((a,b)=>a.ts-b.ts);
  const approvatePerGiorno = {}; // iso date -> Set pizId assenti/conteggiati
  ordinate.forEach(r=>{
    let start = new Date(r.from), end = new Date(r.to);
    let conflitto = false;
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      const iso = d.toISOString().slice(0,10);
      const giornoIdx = (d.getDay()+6)%7; // 0=lun
      const gkey = GIORNI[giornoIdx];
      const localiAttivi = locali.filter(l=>localeActiveOnDate(l, d));
      const fabbisognoTotale = localiAttivi.reduce((s,l)=>s+(l.fabbisogno[gkey]||0),0);
      const assentiOggi = (approvatePerGiorno[iso]||new Set()).size + 1; // +1 = questa richiesta
      const disponibiliTotali = pizzaioli.length - assentiOggi;
      if(disponibiliTotali < fabbisognoTotale) conflitto = true;
    }
    // la malattia non si può rifiutare: è sempre approvata, ma segnaliamo se scopre un turno
    const daApprovare = r.tipo === 'malattia' ? true : !conflitto;
    r.stato = r.tipo === 'malattia' ? 'approvato' : (conflitto ? 'conflitto' : 'approvato');
    r.scoperto = r.tipo === 'malattia' ? conflitto : false;
    if(daApprovare){
      for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
        const iso = d.toISOString().slice(0,10);
        if(!approvatePerGiorno[iso]) approvatePerGiorno[iso] = new Set();
        approvatePerGiorno[iso].add(r.pizId);
      }
    }
  });
}

function isoWeekNumber(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t - yearStart) / 86400000) + 1) / 7);
}

      <tbody>`;

  locali.forEach(locale=>{
    html += `<tr><td class="foglio-locale-cell"><div class="foglio-locale-name">${locale.nome}</div>${locale.stagionale? '<div class="foglio-coverage" style="color:var(--inkfaint)">stagionale</div>':''}</td>`;
    GIORNI.forEach((g,idx)=>{
      const date = dateForDay(idx);
      if(!localeActiveOnDate(locale, date)){ html += `<td><span class="foglio-empty-cell">chiuso</span></td>`; return; }
      const assegnati = data[locale.id][g];
      const need = locale.fabbisogno[g] || 0;
      const short = assegnati.length < need;
      const ordered = [...assegnati].sort((a,b)=>POS_ORDER.indexOf(a.pos)-POS_ORDER.indexOf(b.pos));
      const righe = ordered.map(a=>{
        const p = pizzaioli.find(x=>x.id===a.pizId);
        if(!p) return '';
        const badgeCls = a.pos==='forno' ? 'foglio-badge forno' : 'foglio-badge';
        return `<div class="foglio-slot"><span class="${badgeCls}">${POS_BADGE[a.pos]||'·'}</span>${p.nome.split(' ')[0]} ${p.nome.split(' ').slice(1).map(w=>w[0]+'.').join('')}</div>`;
      }).join('');
      html += `<td>
        <div class="foglio-coverage ${short?'foglio-shortfall':''}">${assegnati.length}/${need}</div>
        ${righe || '<span class="foglio-empty-cell">da assegnare</span>'}
      </td>`;
    });
    html += `</tr>`;
  });

  html += `</tbody></table></div>

    <div class="foglio-legend">
      ${POS_ORDER.map(p=>`<div class="foglio-legend-item"><span class="foglio-badge ${p==='forno'?'forno':''}">${POS_BADGE[p]}</span>${POS_FULL[p]}</div>`).join('')}
    </div>

    <div class="foglio-notes">
      <div class="foglio-notes-label">Note di servizio</div>
      <div class="foglio-notes-line"></div>
      <div class="foglio-notes-line"></div>
    </div>

    <div class="foglio-foot">
      <span>Gruppo Orso — Messina</span>
      <span>Documento generato automaticamente</span>
    </div>
  </div></div>`;

  document.getElementById('printArea').innerHTML = html;
}

/* ============ INIT ============ */
recomputeRichiesteStatus();
renderTurni();
</script>
</body>
</html>
